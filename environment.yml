name: amworkflow
channels:
  - conda-forge
  - defaults
  - bam77
dependencies:
  - pythonocc-core=7.7.0
  - python >= 3.10
  - doit
  - matplotlib
  - pandas
  - sqlite
  - numpy
  - fenicsxconcrete
  - meshio
  - mpich
  - pyvista
  - pytest
  - pyyaml
  - pip
  - pip:
    - gmsh==4.11.1
    - networkx
    - pyqt5
    - Sphinx
    - sqlalchemy
    - stl-to-voxel
    - sphinx-autobuild
    - sphinx-rtd-theme
    - sphinx-book-theme
    - sphinxcontrib-applehelp
    - sphinxcontrib-devhelp
    - sphinxcontrib-htmlhelp
    - sphinxcontrib-jquery
    - sphinxcontrib-jsmath
    - sphinxcontrib-qthelp
    - sphinxcontrib-serializinghtml
    - myst-parser